server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed filenames (index-Dr8N9nIV.js) — safe to cache forever.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback: /products/armenian-coffee is not a file — serve
    # index.html and let react-router interpret the URL (the production twin
    # of Vite's dev behavior).
    location / {
        try_files $uri /index.html;
    }

    # The API lives in another container; "api" resolves via Docker's
    # internal DNS on the compose network (twin of vite.config.ts proxy).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
    }
}
