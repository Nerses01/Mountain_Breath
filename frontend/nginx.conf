server {
    listen 80;

    # Docker's embedded DNS. Combined with variable proxy_pass below, nginx
    # resolves "api" at REQUEST time, not at startup — so nginx boots fine
    # even if the api container isn't up yet (e.g. after a host restart,
    # where restart policies revive containers in arbitrary order).
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits hashed filenames (index-Dr8N9nIV.js) — safe to cache forever.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback: /products/armenian-coffee is not a file — serve
    # index.html and let react-router interpret the URL (the production twin
    # of Vite's dev behavior).
    location / {
        try_files $uri /index.html;
    }

    # The API lives in another container; "api" resolves via Docker's
    # internal DNS on the compose network (twin of vite.config.ts proxy).
    # Using a variable defers the DNS lookup to request time (see resolver).
    set $api_upstream http://api:8080;

    location /api/ {
        # nginx's default body cap is 1 MB, which rejected every media
        # upload with ITS OWN raw-HTML 413 before the API could answer.
        # 52m = the API's 50 MB video cap plus multipart framing headroom,
        # so for anything under it the app's JSON error envelope (with the
        # real reason: too_large, unsupported_type, gallery_full…) is what
        # the admin form receives. Scoped to /api/: no other location
        # accepts request bodies. The app remains the real gate — this
        # only stops nginx from answering first.
        client_max_body_size 52m;

        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    # E10 SEO: the sitemap is generated by the api (only it knows the
    # product slugs) but must live on the public origin, where robots.txt
    # and crawlers expect it.
    location = /sitemap.xml {
        proxy_pass $api_upstream;
    }

    # Uploaded product images — served by the api's file server; cacheable.
    location /uploads/ {
        proxy_pass $api_upstream;
        expires 7d;
        add_header Cache-Control "public";
    }
}
