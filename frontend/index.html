<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mountain Breath — tea, coffee & honey</title>
    <!-- Site icons: generated by scripts/generate-icons.ts, never edited by
         hand. ICO first, SVG second, on purpose: Chrome and Firefox pick the
         SVG when it is listed (the ICO's sizes="32x32" keeps it from
         outranking the SVG), Safari cannot render SVG icons and falls back to
         the ICO, and /favicon.ico is the path every crawler probes unprompted. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- --color-panel-soft: Android Chrome tints its toolbar like the header strip. -->
    <meta name="theme-color" content="#fef4e8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
