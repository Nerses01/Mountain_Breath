name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2 # keep in sync with local install
          working-directory: backend

      - name: Build
        run: go build ./...

      # -race works here (Linux has cgo out of the box) and testcontainers
      # uses the runner's preinstalled Docker for the store tests.
      - name: Test (with race detector)
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci = clean install exactly from package-lock.json (never updates it)
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Component tests
        run: npm run test

      - name: Typecheck + build
        run: npm run build

  e2e:
    # The most expensive job (browser install + full stack): runs on PRs and
    # master, but not on plain dev pushes — those get the fast unit/lint
    # feedback only.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # A throwaway Postgres lives next to the job, like docker-compose in dev.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mb
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mountain_breath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mb -d mountain_breath"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Inherited by Playwright's webServer child processes (go run + vite).
      MB_DATABASE_URL: postgres://mb:ci-password@localhost:5432/mountain_breath?sslmode=disable
      MB_ENV: dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply migrations
        run: >
          go run -tags postgres
          github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          -path backend/migrations -database "$MB_DATABASE_URL" up

      - name: Seed catalog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "$MB_DATABASE_URL" -f backend/seed/seed.sql

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: frontend
        run: npm run e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  # E10: Lighthouse with budgets (frontend/lighthouserc.json) against the
  # PRODUCTION build served by vite preview, with the real API behind it —
  # auditing the dev server would measure Vite's bookkeeping, not the site.
  # Runs where e2e runs; a failed budget fails the build, which is the
  # "CI blocks a Lighthouse regression" half of the phase's definition of
  # done (the axe half rides inside the e2e job's a11y spec).
  lighthouse:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mb
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mountain_breath
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mb -d mountain_breath"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MB_DATABASE_URL: postgres://mb:ci-password@localhost:5432/mountain_breath?sslmode=disable
      MB_ENV: dev
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply migrations
        run: >
          go run -tags postgres
          github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          -path backend/migrations -database "$MB_DATABASE_URL" up

      - name: Seed catalog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql "$MB_DATABASE_URL" -f backend/seed/seed.sql

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start api and preview server
        run: |
          (cd backend && go run ./cmd/api) &
          (cd frontend && npm run preview) &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break || sleep 1
          done
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break || sleep 1
          done

      - name: Lighthouse with budgets
        working-directory: frontend
        run: >
          npx --yes @lhci/cli@0.15.x autorun
          --collect.url=http://localhost:4173/
          --collect.url=http://localhost:4173/shop
          --collect.url=http://localhost:4173/products/mountain-wildflower-honey

  # Publish images to GitHub Container Registry — only for green builds of
  # master, never for PRs. Phase 9's deploy will pull exactly these.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allows pushing to ghcr.io with the built-in token
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/nerses01/mountain-breath-api:latest
            ghcr.io/nerses01/mountain-breath-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/nerses01/mountain-breath-web:latest
            ghcr.io/nerses01/mountain-breath-web:${{ github.sha }}

  # CD: green master → images published → server updates itself.
  # Dormant until the repository variable DEPLOY_ENABLED is set to 'true'
  # (docs/DEPLOYMENT.md, step 9) so CI stays green before the server exists.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the code on the GitHub Runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Securely copy the Compose file AND your migrations folder to your VPS
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,backend/migrations"
          target: ${{ vars.TARGET_DIR }}

      # 3. SSH in and start the containers
      - name: Start services
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOMAIN: ${{ vars.DOMAIN }} # Use secrets.DOMAIN if you stored it as a secret
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: POSTGRES_PASSWORD,DOMAIN
          script: |
            set -e
            mkdir -p ${{ vars.TARGET_DIR }}
            cd ${{ vars.TARGET_DIR }}
            
            # Export all injected variables so Docker Compose can see them
            export POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            export DOMAIN=$DOMAIN
            
            # Login to GHCR on the VPS
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the new images and start them
            docker compose -f deploy/docker-compose.prod.yml pull
            docker compose -f deploy/docker-compose.prod.yml up -d
            
            # Force Caddy to reload its configuration file
            docker compose -f deploy/docker-compose.prod.yml restart caddy
            
            # Clean up old images
            docker image prune -f
