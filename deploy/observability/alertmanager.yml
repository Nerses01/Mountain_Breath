# Alertmanager: receives fired alerts from Prometheus, groups/deduplicates
# them, and routes to notification channels.
route:
  receiver: default
  group_by: [alertname]
  # A new alert notifies quickly; repeats of the SAME alert are throttled.
  group_wait: 30s
  repeat_interval: 4h

receivers:
  - name: default
    # This is the LOCAL stack's config: no channel, alerts are visible in
    # the UI (localhost:9093) and that is all. Production's config is not
    # this file — it is rendered inline by deploy/docker-compose.prod.yml
    # (decision #105): the same route, plus a Telegram receiver whose chat
    # id compose interpolates from .env and whose bot token rides as a
    # compose secret file. Keep the route settings above in step with it.
