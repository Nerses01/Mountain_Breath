# Prometheus works by PULL: every 10s it visits each target's /metrics and
# stores the samples. Services don't send anything — they just answer.
global:
  scrape_interval: 10s
  evaluation_interval: 15s # how often alert rules are checked

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mountain-breath-api
    static_configs:
      - targets: ["api:8080"] # Docker DNS, inside the compose network
