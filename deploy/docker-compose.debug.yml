# Debug override: temporarily exposes the prod-stack postgres on host port
# 5433 so GUI tools can inspect it. NEVER use on a real server.
#
# Open the window:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.debug.yml up -d postgres
# Close it again:
#   docker compose -f deploy/docker-compose.yml up -d postgres
services:
  postgres:
    ports:
      - "5433:5432"
