# PRODUCTION stack — runs on the home server from a clone at /opt/mountain-breath.
#   docker compose -f deploy/docker-compose.prod.yml up -d
# Differences vs docker-compose.yml (local): images are PULLED from GHCR
# (never built on the server), MB_ENV=prod, and the internet reaches us
# through a Cloudflare named tunnel (decision #100, reversing #12): the
# cloudflared service dials OUT to Cloudflare and visitors are relayed back
# down that connection. HTTPS terminates at Cloudflare's edge with a real
# certificate for ${DOMAIN}; nothing here listens on a public port, which is
# what makes this deployable behind the ISP's CGNAT.
# Secrets come from deploy/.env on the server (see docs/DEPLOYMENT_HOME.md).
name: mountain-breath

services:
  # The only service that talks to the internet — outbound only. The tunnel
  # itself (which hostname routes to which service) is configured in the
  # Cloudflare dashboard and identified by the token; this container is just
  # the connector. `latest` is deliberate where everything else is pinned:
  # the connector speaks Cloudflare's own protocol and they expect it
  # current — each deploy's `compose pull` refreshes it.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?from the Zero Trust tunnel page — set in deploy/.env}
    depends_on:
      - web
    restart: unless-stopped

  web:
    image: ghcr.io/nerses01/mountain-breath-web:latest
    ports:
      # Host-local smoke test only (curl http://localhost:8081 on the
      # server) — loopback-bound, invisible to the LAN and the internet.
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/nerses01/mountain-breath-api:latest
    environment:
      MB_ADDR: ":8080"
      MB_ENV: prod # the browser side is HTTPS (Cloudflare edge) → Secure session cookies on
      MB_DATABASE_URL: postgres://${POSTGRES_USER:-mb}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-mountain_breath}?sslmode=disable
      MB_UPLOADS_DIR: /uploads
      # The origin the BROWSER uses (emailed links, OAuth redirects).
      # Derived from the tunnel's hostname so it cannot drift from it.
      MB_PUBLIC_URL: https://${DOMAIN:?set the site domain in deploy/.env}
      # Optional (E8): unset SMTP = mail lands in the api log; unset Google
      # keys = the sign-in button explains itself. Same contract as the
      # local stack.
      MB_SMTP_ADDR: ${MB_SMTP_ADDR:-}
      MB_SMTP_USERNAME: ${MB_SMTP_USERNAME:-}
      MB_SMTP_PASSWORD: ${MB_SMTP_PASSWORD:-}
      MB_MAIL_FROM: ${MB_MAIL_FROM:-}
      MB_GOOGLE_CLIENT_ID: ${MB_GOOGLE_CLIENT_ID:-}
      MB_GOOGLE_CLIENT_SECRET: ${MB_GOOGLE_CLIENT_SECRET:-}
    volumes:
      - uploads_data:/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ../backend/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://${POSTGRES_USER:-mb}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-mountain_breath}?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-mountain_breath}
    # loopback-bound: reachable for psql on the server itself, not from
    # outside the machine
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Observability (decision #101) ────────────────────────────────────
  # Same trio as the local stack, one difference that IS the point: every
  # port is bound to 127.0.0.1 — reachable from the laptop itself and
  # nothing else. Grafana is a login surface and Prometheus has NO auth,
  # so neither may ever face the internet; you reach them over the
  # tailnet:  ssh -L 3000:localhost:3000 capybara@homeserver
  # (docs/DEPLOYMENT_HOME.md → Observability).
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    # The guard. Compose does NOT fail when a secret's file is missing: it
    # warns and mounts an empty DIRECTORY in its place (verified), and
    # Alertmanager reads bot_token_file only when it first tries to notify
    # — the channel would be silently dead. And the chat id must not be a
    # `:?` here: compose re-reads this file for EVERY command, so a hard
    # requirement made backups, logs and restores fail on the laptop until
    # the value existed (found 2026-09-03). So this container refuses to
    # start without a real token file and a chat id, and says which one.
    # `-r` matters: the image runs as `nobody` (uid 65534) and a bind mount
    # keeps the host's owner and mode, so a 600 file owned by the deploy
    # user exists, is non-empty, and is still unreadable in here (found
    # the same day, from the notify error). The runbook chowns it to 65534.
    # `sh -c 'script' -- ARGS`: "--" becomes $0 and the command's arguments
    # arrive as "$@" for the exec; `$$` is how compose is told to leave a
    # dollar sign alone.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -f /run/secrets/telegram_token ] && [ -s /run/secrets/telegram_token ] && [ -r /run/secrets/telegram_token ] || { echo "telegram token file missing, empty, or not readable by uid 65534: deploy/observability/telegram.token (runbook step 12)" >&2; exit 1; }; [ -n "$$TELEGRAM_CHAT_ID" ] || { echo "TELEGRAM_CHAT_ID missing from deploy/.env (runbook step 12)" >&2; exit 1; }; exec /bin/alertmanager "$$@"'
      - "--"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    environment:
      # Not a secret; present only so the entrypoint above can refuse to
      # start without it. The rendered config (bottom of this file) gets a
      # placeholder 0 when it is unset, instead of failing every command.
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    configs:
      # Unlike the local stack, the config is not a mounted file: compose
      # renders it (see `configs:` at the bottom) so the Telegram chat id
      # can come from deploy/.env — Alertmanager expands no environment
      # variables of its own.
      - source: alertmanager
        target: /etc/alertmanager/alertmanager.yml
    secrets:
      - telegram_token # becomes the file /run/secrets/telegram_token
    volumes:
      - ./observability/telegram.tmpl:/etc/alertmanager/telegram.tmpl:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # No dev fallback here: prod requires a real password in deploy/.env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set a strong one in deploy/.env}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata_prod:
  uploads_data:
  prom_data:
  grafana_data:

# ── Alerts to a phone (decision #105) ────────────────────────────────────
# Alertmanager reads no environment variables, so the one deployment-
# specific value in its config — the Telegram chat id — is put there by
# compose: `content:` is interpolated exactly like the rest of this file.
# The bot token is a secret and rides as a FILE, never in an env var or in
# this text: compose mounts deploy/observability/telegram.token
# (git-ignored via *.token) at /run/secrets/telegram_token, and the config
# refers to it by path. Both are REQUIRED — but not through `:?`: a `:?`
# on the chat id made EVERY compose command on the laptop fail until the
# value existed, the backup's `compose exec` included (found 2026-09-03).
# So the config renders a placeholder 0 when the variable is unset, and
# the alertmanager container's entrypoint (above) refuses to start without
# the real value or the token file; the CI deploy checks both before `up`.
# Unrelated commands — backups, logs, a restore on a new machine — never
# depend on the alert channel being configured. Create both before the
# deploy that carries this (runbook step 12).
configs:
  alertmanager:
    content: |
      route:
        receiver: telegram
        group_by: [alertname]
        # A new alert notifies quickly; repeats of the SAME alert are
        # throttled — and repeat until it is resolved.
        group_wait: 30s
        repeat_interval: 4h
      receivers:
        - name: telegram
          telegram_configs:
            - bot_token_file: /run/secrets/telegram_token
              chat_id: ${TELEGRAM_CHAT_ID:-0}
              parse_mode: HTML
              message: '{{ template "telegram.mb.message" . }}'
      templates:
        - /etc/alertmanager/telegram.tmpl

secrets:
  telegram_token:
    file: ./observability/telegram.token
